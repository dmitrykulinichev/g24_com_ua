 <circle cx="200" cy="250" r="6" fill="#2563eb"/>
 <circle cx="300" cy="280" r="6" fill="#2563eb"/>
 <circle cx="400" cy="150" r="6" fill="#2563eb"/>
 <circle cx="500" cy="200" r="6" fill="#2563eb"/>
 <circle cx="600" cy="100" r="6" fill="#2563eb"/>
 <circle cx="700" cy="120" r="6" fill="#2563eb"/>

 <!-- Осі -->
 <line x1="80" y1="350" x2="720" y2="350" stroke="#9ca3af" stroke-width="2"/>
 <line x1="80" y1="350" x2="80" y2="50" stroke="#9ca3af" stroke-width="2"/>
</svg>