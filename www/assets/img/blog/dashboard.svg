<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
 <rect width="100%" height="100%" fill="#f3f4f6"/>
 <text x="50%" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#374151">Аналітика витрат пального</text>

 <!-- Графік -->
 <polyline points="100,300 200,250 300,280 400,150 500,200 600,100 700,120"
  fill="none" stroke="#2563eb" stroke-width="4"/>

 <!-- Точки -->
