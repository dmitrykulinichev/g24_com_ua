<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
 <rect width="100%" height="100%" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

 <!-- Трекер -->
 <rect x="100" y="100" width="150" height="100" rx="10" fill="#1f2937"/>
 <text x="175" y="155" font-family="Arial" font-size="16" text-anchor="middle" fill="white">GPS Tracker</text>
 <circle cx="130" cy="130" r="5" fill="#10b981"/> <!-- LED -->

 <!-- Дроти -->
 <line x1="250" y1="130" x2="400" y2="130" stroke="#ef4444" stroke-width="4"/> <!-- + -->
 <text x="325" y="120" font-family="Arial" font-size="12" fill="#ef4444">12V (+)</text>

 <line x1="250" y1="170" x2="400" y2="170" stroke="#000000" stroke-width="4"/> <!-- - -->
 <text x="325" y="190" font-family="Arial" font-size="12" fill="#000000">GND (-)</text>

 <!-- Авто -->
 <rect x="400" y="80" width="200" height="140" rx="5" fill="#e5e7eb" stroke="#9ca3af" stroke-dasharray="5,5"/>
 <text x="500" y="155" font-family="Arial" font-size="16" text-anchor="middle" fill="#6b7280">Бортова мережа</text>
</svg>